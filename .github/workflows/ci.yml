name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feat/**"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gogo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gogo_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Check server and browser JavaScript syntax
        run: |
          node --check app.js
          node --check public/app.js
      - name: Run automated tests (including PostgreSQL integration)
        env:
          RUN_POSTGRES_INTEGRATION: "1"
          POSTGRES_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/gogo_test
        run: npm test

  windows-agent:
    name: Windows agent PowerShell validation
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Parse all Windows agent scripts
        shell: pwsh
        run: |
          $scripts = Get-ChildItem -Path agent/windows -Filter *.ps1 -File
          if (-not $scripts) {
            throw "No PowerShell scripts found under agent/windows."
          }
          $failed = $false
          foreach ($script in $scripts) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $script.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $failed = $true
              Write-Error "PowerShell parse errors in $($script.Name):"
              $errors | ForEach-Object { Write-Error $_.Message }
            } else {
              Write-Host "PASS: $($script.Name)"
            }
          }
          if ($failed) {
            throw "One or more Windows agent scripts failed PowerShell parsing."
          }
